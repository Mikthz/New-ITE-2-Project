{% extends "main/admin_panel.html" %}

{% block title %}Login{% endblock %}

{% block unauthenticated_content %}

<div class="flex min-h-screen items-center justify-center px-4 py-10">

    <div class="w-full max-w-md rounded-4xl bg-white p-8 shadow-xl border border-orange-100">

        <div class="mb-10">
            <div class="mb-4 h-1 w-16 rounded-full bg-orange-500"></div>

            <h1 class="text-3xl font-bold leading-tight text-slate-900">
                Login to your account
            </h1>

        </div>

        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none transition focus:border-orange-400 focus:bg-white"
                    required
                >
            </div>

            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4 outline-none transition focus:border-orange-400 focus:bg-white"
                    required
                >
            </div>

            <div class="flex items-center gap-3 pt-1">
                <input type="checkbox" class="h-4 w-4 rounded border-slate-300 text-orange-500 focus:ring-orange-400">

                <span class="text-sm text-slate-500">
                    Remember me
                </span>
            </div>

            <button
                type="submit"
                class="w-full rounded-2xl bg-orange-500 py-4 text-sm font-bold text-white transition hover:bg-orange-600"
            >
                Login
            </button>

        </form>

        <div class="mt-10 text-center text-sm text-slate-500">
            Don't have an account?
            <a href="{% url 'account_creation' %}" class="font-semibold text-orange-500 hover:text-orange-600">
                Register
            </a>
        </div>

    </div>

</div>

{% endblock %}
