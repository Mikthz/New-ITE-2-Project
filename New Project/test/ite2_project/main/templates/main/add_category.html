{% extends "main/admin_panel.html" %}
{% load static %}

{% block title %} Add Category {% endblock %}

{% block content %}

<div class="flex min-h-screen items-center justify-center bg-slate-100 p-4 md:p-6">
    <div class="w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">

        <h1 class="mb-6 text-2xl font-bold text-blue-600 md:text-3xl">
            Add Category
        </h1>

        <form method="POST" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="mb-2 block font-semibold">
                    Category Name
                </label>

                <input
                    type="text"
                    name="category_name"
                    class="w-full rounded-xl border border-slate-300 p-3 outline-none focus:border-blue-400"
                    required
                />
            </div>

            <button
                type="submit"
                class="w-full rounded-xl bg-blue-500 py-4 font-bold text-white hover:bg-blue-600"
            >
                Add Category
            </button>
        </form>

    </div>
</div>

{% endblock %}
