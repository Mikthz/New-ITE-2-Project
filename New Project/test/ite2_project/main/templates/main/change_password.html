{% extends "main/admin_panel.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900">Change Password</h1>
</div>

<form method="POST" class="space-y-6">
    {% csrf_token %}

    {% if error %}
        <p class="rounded-xl bg-red-100 p-4 text-red-700">{{ error }}</p>
    {% endif %}

    <section class="card p-6 space-y-5">
        <div>
            <label class="mb-2 block text-sm font-semibold">Current Password</label>
            <input type="password" name="current_password" class="input" required>
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold">New Password</label>
            <input type="password" name="new_password" class="input" required>
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold">Confirm New Password</label>
            <input type="password" name="confirm_password" class="input" required>
        </div>
    </section>

    <div class="flex justify-end">
        <button class="btn-primary">Save Password</button>
    </div>
</form>
{% endblock %}
