{% load static %}

<!doctype html>
<html>
  <head>
    <title>Login</title>

    <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  </head>

  <body class="flex min-h-screen items-center justify-center bg-gray-100">
    <div class="w-96 rounded-2xl bg-white p-10 shadow-xl">
      <h1 class="mb-6 text-center text-3xl font-bold text-slate-800">Login</h1>

      {% if error %}
      <p class="mb-4 text-red-500">{{ error }}</p>
      {% endif %}

      <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" class="mb-4 w-full rounded-xl border border-slate-300 bg-slate-50 p-3 outline-none transition focus:border-blue-400 focus:bg-white" />

        <input type="password" name="password" placeholder="Password" class="mb-4 w-full rounded-xl border border-slate-300 bg-slate-50 p-3 outline-none transition focus:border-blue-400 focus:bg-white" />

        <button type="submit" class="w-full rounded-xl bg-blue-500 py-3 font-semibold text-white transition hover:bg-blue-600">Log in</button>
      </form>

      <a href="{% url 'account_creation' %}" class="mt-4 block text-center font-medium text-blue-600 hover:text-blue-700"> Create Account </a>
    </div>
  </body>
</html>
