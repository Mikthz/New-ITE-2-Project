{% extends "main/admin_panel.html" %}

{% block title %}Quotations{% endblock %}

{% block content %}

<div class="mb-8 flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
    <div>
        <h1 class="text-3xl font-bold text-slate-900">Quotations</h1>
        <p class="mt-1 text-sm text-slate-500">Manage customer quotations</p>
    </div>

    <a href="{% url 'create_quotation' %}" class="btn-primary">
        <i class="fa-solid fa-plus mr-2"></i>
        Create Quotation
    </a>
</div>

<div class="card overflow-hidden">

    <div class="border-b border-slate-200 p-5">
        <div class="flex items-center gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3">
            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
            <input
                type="text"
                placeholder="Search quotations by ID or customer..."
                class="w-full bg-transparent text-sm outline-none"
            >
        </div>
    </div>

    <div class="overflow-x-auto">
        <table class="w-full min-w-225 text-sm">

            <thead class="table-head">
                <tr>
                    <th class="p-4">Quotation ID</th>
                    <th class="p-4">Customer</th>
                    <th class="p-4">Date</th>
                    <th class="p-4">Items</th>
                    <th class="p-4">Amount</th>
                    <th class="p-4">Status</th>
                    <th class="p-4 text-right">Actions</th>
                </tr>
            </thead>

        </table>
    </div>

</div>

{% endblock %}
