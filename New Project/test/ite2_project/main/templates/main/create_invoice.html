{% extends "main/admin_panel.html" %}

{% block title %}Create Invoice{% endblock %}

{% block content %}

<div class="mb-8 flex items-center justify-between">
    <div>
        <h1 class="text-3xl font-bold text-slate-900">Create Invoice</h1>
        <p class="mt-1 text-sm text-slate-500">Prepare a customer invoice record</p>
    </div>

    <a href="{% url 'invoices' %}" class="btn-secondary">
        <i class="fa-solid fa-arrow-left mr-2"></i>
        Back
    </a>
</div>

<div class="card p-8">
    <div class="mb-6 flex items-center gap-3 border-b border-slate-200 pb-5">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-orange-100 text-orange-600">
            <i class="fa-solid fa-file-invoice-dollar text-lg"></i>
        </div>

        <div>
            <h2 class="text-xl font-bold text-slate-900">Invoice Information</h2>
            <p class="text-sm text-slate-500">Invoice backend will be connected later</p>
        </div>
    </div>

    <form class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <div>
            <label class="mb-2 block text-sm font-semibold">Customer Name</label>
            <input class="input" placeholder="Enter customer name">
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold">Invoice Date</label>
            <input type="date" class="input">
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold">Due Date</label>
            <input type="date" class="input">
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold">Status</label>
            <select class="input">
                <option>Pending</option>
                <option>Paid</option>
                <option>Overdue</option>
            </select>
        </div>

        <div class="md:col-span-2">
            <label class="mb-2 block text-sm font-semibold">Notes</label>
            <textarea class="input" rows="4" placeholder="Invoice notes"></textarea>
        </div>

        <div class="md:col-span-2 flex justify-end">
            <button type="button" class="btn-primary">
                <i class="fa-solid fa-floppy-disk mr-2"></i>
                Save Invoice
            </button>
        </div>
    </form>
</div>

{% endblock %}
