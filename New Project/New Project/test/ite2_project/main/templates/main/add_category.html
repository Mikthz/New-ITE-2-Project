{% extends "main/admin_panel.html" %}

{% block title %}Add Category{% endblock %}

{% block content %}

<div class="mb-8">
    <h1 class="text-3xl font-bold text-slate-900">Add Category</h1>
    <p class="mt-1 text-sm text-slate-500">Create a product category</p>
</div>

<div class="card p-8">
    <div class="mb-6 flex items-center gap-3">
        <div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-orange-100 text-orange-600">
            <i class="fa-solid fa-list text-lg"></i>
        </div>

        <div>
            <h2 class="text-xl font-bold text-slate-900">Category Information</h2>
            <p class="text-sm text-slate-500">Add a category for organizing products</p>
        </div>
    </div>

    <form method="POST" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-700">
                Category Name
            </label>

            <input
                type="text"
                name="category_name"
                class="input"
                required
            >
        </div>

        <div class="flex justify-end border-t border-slate-100 pt-5">
            <button class="btn-primary">
                <i class="fa-solid fa-floppy-disk mr-2"></i>
                Save Category
            </button>
        </div>
    </form>
</div>

{% endblock %}
